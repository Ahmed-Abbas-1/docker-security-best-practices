<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmed's Cloud Infrastructure</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            font-size: 1.2rem;
            font-weight: 400;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .badges {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .badge {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 0.9rem;
            border: 1px solid rgba(56, 189, 248, 0.3);
            letter-spacing: 1px;
        }

        .success-msg {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            padding: 15px;
            border-radius: 10px;
            font-weight: 600;
            border: 1px solid rgba(34, 197, 94, 0.3);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.2);
        }

        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Cloud Infrastructure Hub</h1>
        <h2>Architected by Ahmed Mohamed Abbas Bahij</h2>
        
        <div class="badges">
            <span class="badge">Dockerized</span>
            <span class="badge">Multi-Stage Build</span>
            <span class="badge">Non-Root Secured</span>
        </div>

        <div class="success-msg">
            🚀 The container is running flawlessly in a highly optimized state!
        </div>

        <div class="footer">
            Powered by Node.js & Alpine Linux | 9-Month ITI Professional Training Program
        </div>
    </div>
</body>
</html>
